# crossing-rehearsal.yml — the next crossing, run over THIS pull request's tree,
# so a "would refuse" lands on the PR instead of at 05:45Z twelve hours later.
#
# WHY. Since 2026-09-16 the crossing refuses only for HARM: the five data-shaped
# checks in `tools/harm-gate.mjs` over the tree the sweep produced against the
# tree it started from. That gate is the right gate, and today a pull request
# meets it for the first time AFTER it has merged — at the next crossing, when a
# refusal is a crisis for the whole town and the author has gone to bed. The
# suite (`suite.yml`) tests this tree; nothing rehearses the CROSSING over it.
#
# WHAT THIS IS NOT. The box already rehearses the next crossing hourly
# (`deploy/settlement-shadow.sh`, twice daily at :23 in the office repo) — but
# that shadow rehearses MAIN, it is older than the gate (born 2026-08-21, the
# gate ruled 09-16), and it does not run the gate at all. Its verdict is "would
# the sweep refuse / would the suite go red". This job asks the newer question,
# over the tree that has not merged yet.
#
# SECURITY, and it is the load-bearing half. The trigger is `pull_request` and
# never the sibling trigger that runs with the BASE repository's token and
# secrets — `tools/rehearsal-posture.mjs` § 1 names that trigger, and this file
# deliberately does not, because that check reads this file WHOLE, comments
# included: the cheapest way for the dangerous trigger to arrive here is as a
# line somebody copied out of a comment. This job runs the pull request's own
# code, so it gets no secrets and a read-only token. It needs neither. The world declares no
# dependencies, so there is no install step and nothing is fetched from a
# registry; the sweep and the gate read only this repository's own refs; the
# only env the sweep reads at all is BOT_NAME/BOT_EMAIL, which this job does not
# set (`git config` covers the same ground where the sweep's rebase actually
# looks). The posture is asserted rather than asserted-about:
# `tools/rehearsal-posture.mjs` reads THIS FILE and refuses on the base-token
# trigger, a widened permission, a secret reference, or a push/tag/remote verb.
#
# THAT TOOL IS NOT A BOUNDARY AGAINST A HOSTILE PULL REQUEST, and its header says
# so at the top: it is a file in the tree under test, so a pull request that
# weakened this file would weaken it alongside. The boundary against an outside
# author is GitHub's own — a fork's `pull_request` run gets a read-only token and
# no secrets whatever this file declares. The tool is a regression guard on
# OURSELVES: the realistic way this job turns dangerous is a maintainer adding a
# step that needs "just a token" at 05:45Z, and every shape of that reds it. It
# runs FIRST so it fails before the sweep spends four minutes, and again in the
# suite as a pin so it holds on pull requests that never trigger this job.
#
# THE ONE THING IT CANNOT HAVE, stated so nobody has to discover it: the town.
# The crossing derives its stakes from a store read or a pinned town clone; a
# `pull_request` token reaches neither. `tools/rehearsal-stakes.mjs` rebuilds
# them from `WORLD/world-state.json` — the fold the last crossing committed into
# this tree — and REFUSES rather than hand the sweep an unreconciled file. Read
# that tool's header for the run where a merely-WRONG stakes file swept seven
# marks out of the world under a green gate.
#
# AND NO SKETCHBOOKS, which is the second limit, stated plainly (POS-421, ruled
# REPLACE by Darko 2026-10-09). The box crosses from the store: the office
# deletes every draft ref in its settlement clone and writes the store's pending
# claims down as LOCAL `draft/*` sketchbooks before the sweep runs
# (`settlement-sweep.mjs` § "WHOSE SKETCHBOOKS THESE ARE, UNDER A STORE
# CROSSING"; office `src/store-writedown.mjs`). Those claims are the households'
# own and a `pull_request` token reaches no store, so this job has no candidates
# to cross. Until 2026-10-09 it swept the git-era `draft/*` branches instead.
# They were stale stand-ins, red on main itself from 09-26 (POS-371), and they
# are deleted after the notes import (POS-392). So this job clears every draft
# ref in its checkout, the way the box does, and rehearses the crossing a store
# with nothing pending would make: the pull request's own sweep, fold and lint
# over the merged tree. Then it judges that as a snapshot pair (POS-363):
# main as the merge sees it (`HEAD^1`), and the merged tree once it is swept.
#
# WHAT THAT GIVES UP: no candidate crosses on a pull request. The sweep's
# publish path (rebase, amend, nesting, parcel claims) is held by the suite's
# fixtures and by POS-354's dev rehearsal, which crosses real claims from the
# dev store through the office's own write-down into world main. What it keeps
# is what a pull request is actually asked about: lint, moved, lost, escrow and
# parcels over this tree's marks against the main it lands on.

name: crossing rehearsal
on:
  pull_request:
    branches: [main]

concurrency:
  group: crossing-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crossing-rehearsal:
    name: crossing rehearsal
    if: github.repository == 'postmark-town/postmark-world'
    runs-on: ubuntu-latest
    # The sweep with no sketchbooks is the fold, lint and the main-only passes:
    # 23 s locally on 2026-10-09, against 15 minutes when it rebased 41 git
    # sketchbooks and asked main first. A rehearsal that hangs is a red check
    # nobody can read, so it keeps a ceiling with room in it.
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 and NO blob filter, which is the one place this job
      # deliberately differs from suite.yml. The sweep `git archive`s WORLD/ at
      # main and the fold reads history; the exporter archives WORLD/ again at
      # `HEAD^1`. That is most of the repository's blobs, fetched one command at
      # a time on a partial clone. The bytes are cheaper than the round trips.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # FIRST, so it fails in two seconds rather than after the sweep. The step
      # reads this workflow file and holds it to the posture the header claims.
      # Note honestly what it is: this tool ships in the same tree, so it guards
      # US against widening the job later, not the tree against itself — the
      # header of `rehearsal-posture.mjs` says which boundary is which, and this
      # comment deliberately does not claim the stronger one.
      - name: the job cannot write — asserted against this workflow file
        run: node tools/rehearsal-posture.mjs --workflow .github/workflows/crossing-rehearsal.yml

      # The sweep's own commit is made as whoever the environment says it is,
      # and a bare runner is nobody. suite.yml measured this the hard way: 48
      # suites red with "Committer identity unknown". Same runner, same
      # standing-in.
      - name: a committer identity, which the sweep's own commit needs
        run: |
          git config --global user.name "postmark crossing rehearsal"
          git config --global user.email "rehearsal@postmark.invalid"

      # NO SKETCHBOOKS, AND THE ABSENCE IS ASSERTED. fetch-depth: 0 brings every
      # branch, so any git-era `draft/*` still on this remote arrives as a
      # remote-tracking ref, and the sweep surveys local and remote draft refs
      # alike. The box clears them before a store crossing for the same reason
      # (office `store-writedown.mjs` § clearGitSketchbooks: a crossing that only
      # stopped fetching would still fold every stale one). These are this
      # runner's local refs; nothing on the remote is touched.
      - name: no sketchbooks — every draft ref in this checkout cleared, as the box clears them
        run: |
          git for-each-ref --format='delete %(refname)' 'refs/heads/draft/' 'refs/remotes/origin/draft/' | git update-ref --stdin
          books=$(git for-each-ref --format='%(refname)' 'refs/heads/draft/' 'refs/remotes/origin/draft/' | wc -l)
          echo "sketchbooks left in this checkout: $books"
          test "$books" -eq 0 || { echo "::error::$books draft ref(s) survived the clear, so the sweep would cross stand-ins nobody wrote for this crossing" >&2; exit 1; }

      # The merged tree, standing in for main. The sweep publishes into its
      # local main; naming the merge commit `main` is what makes this a rehearsal
      # of the crossing that would follow this pull request.
      #
      # MAIN IS THE MERGE'S FIRST PARENT, not the event's base sha (POS-494 item
      # 1). Measured on #173: the event said 33fbe353 while the merge GitHub
      # built was onto ee017ae4, so the event's sha can be an older main than the
      # one this pull request lands on. It is read here, before the sweep commits
      # on top of the merge, and kept in a file for the gate's before-side.
      - name: the merged tree becomes this rehearsal's main
        run: |
          main_now=$(git rev-parse HEAD^1) || { echo "::error::the merge has no first parent in this checkout, so the gate has no before-side and cannot gate" >&2; exit 1; }
          echo "$main_now" > "$RUNNER_TEMP/main-now"
          git checkout -B main HEAD
          echo "rehearsing over $(git rev-parse HEAD); main as this merge sees it: $main_now (the event's base: ${{ github.event.pull_request.base.sha }})"

      # NOT A TOWN READ. See tools/rehearsal-stakes.mjs's header. Exit 2 here is
      # "could not derive", and it fails the job on purpose.
      - name: the stake picture this tree records about itself
        run: node tools/rehearsal-stakes.mjs --out "$RUNNER_TEMP/stakes.json"

      # The sweep, local only: it never pushes, tags, pins or deploys — its own
      # header says so and nothing in this job hands it a remote it could. With
      # no sketchbooks it publishes nothing, and it still folds, lints and runs
      # its main-only passes over this tree: a refusal here IS the finding, what
      # the next crossing would have said.
      - name: the sweep, rehearsed — no sketchbooks, no push, no tag, no store
        run: |
          set -o pipefail
          if ! node tools/settlement-sweep.mjs --stakes "$RUNNER_TEMP/stakes.json" --json > "$RUNNER_TEMP/sweep.json" 2> "$RUNNER_TEMP/sweep.err"; then
            echo "::error::the crossing would REFUSE — this pull request's tree does not sweep"
            grep -h 'SETTLEMENT-SWEEP-STARVING\|SETTLEMENT-SWEEP-REFUSAL\|^settlement sweep refused' "$RUNNER_TEMP/sweep.err" >&2 || tail -40 "$RUNNER_TEMP/sweep.err" >&2
            exit 1
          fi
          node -e 'const r=require(process.env.RUNNER_TEMP+"/sweep.json");console.log(`sweep: ${r.published.length} published · ${r.left_drafted.length} left drafted · ${r.unpublished.length} unpublished · ${r.withdrawn.length} withdrawn · ${r.quarantined.length} quarantined · ${r.dropped.length} dropped · ${r.rebased.length} rebased`);console.log(`surveyed: ${r.surveyed.branches} sketchbook(s), ${r.surveyed.delta_rows} delta row(s), ${r.surveyed.escrow_backed_deltas} escrow-backed`)'
          # The sweep commits its own result onto the local main (its header:
          # "publishes eligible draft marks into main"), so there is nothing for
          # this job to commit. Said out loud because the absence of a commit
          # step is the kind of thing a reader assumes is a bug.
          git --no-pager log --oneline "$(cat "$RUNNER_TEMP/main-now")..HEAD" | sed 's/^/  /'
          test -z "$(git status --porcelain)" || { echo "::error::the sweep left the tree dirty — the next crossing refuses at checkout for this" >&2; git status --porcelain >&2; exit 1; }

      # THE PAIR (POS-363's seam). Before is main as the merge sees it, read from
      # a scratch extraction at that commit; after is the merged tree once the
      # sweep has committed. Both are the tree loader's own records.
      - name: the snapshot pair — main as this merge sees it, and the swept tree
        run: |
          node tools/snapshot-export.mjs --repo . --ref "$(cat "$RUNNER_TEMP/main-now")" --out "$RUNNER_TEMP/before.json"
          node tools/snapshot-export.mjs --repo . --out "$RUNNER_TEMP/after.json"

      # THE GATE, in its own sentences, over the pair. Its before-side is the
      # main this pull request lands on, not the tree the sweep started from, and
      # that is deliberate: the crossing gates only what the sweep did, while a
      # pull request must be gated on what the sweep did AND what the pull
      # request itself did to the marks. So this diff is strictly wider than the
      # crossing's, and a red here can be the pull request's own hand — which is
      # the point. The gate folds the after side itself with these stakes and
      # lints it through the loader's seam; it prints the before-side's commit as
      # its base.
      #
      # Exit 0 is no harm. Exit 1 is harm, named. Exit 2 is "could not gate" —
      # and is never a pass.
      - name: the harm gate — would this crossing harm anyone
        run: |
          rc=0
          node tools/harm-gate.mjs \
            --repo . \
            --snapshot-before "$RUNNER_TEMP/before.json" \
            --snapshot-after "$RUNNER_TEMP/after.json" \
            --sweep "$RUNNER_TEMP/sweep.json" \
            --stakes "$RUNNER_TEMP/stakes.json" || rc=$?
          if [ "$rc" = 0 ]; then
            echo "no harm — this tree would cross"
          elif [ "$rc" = 1 ]; then
            echo "::error::the crossing would REFUSE. The harm is named above, in the gate's own sentences."
          else
            echo "::error::the crossing would be UNGATED — the gate could not measure this tree (exit $rc), which is never a pass."
          fi
          exit "$rc"
