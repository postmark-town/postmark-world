# suite.yml — where the source pins gate.
#
# RULED 2026-09-14 (Keemin; issue #2790): behaviour gates the candle, text gates
# the pull request. The settlement crossing runs `npm run test:candle`, which
# withholds every test whose title carries "[pin] " — the ones that read a source
# file as text and assert over its shape. Those tests are not retired; they run
# here, on every pull request into main, which is the place a change of shape is
# actually being proposed and a human is already reading.
#
# The instance this closes: 2026-09-14 05:45Z, the S70 crossing. A pin on
# viewer.mjs's shape counted one keepZoom caller; the search bar had lawfully
# made a second. The suite went red, the isolate held all 29 marks back, and the
# crossing published nothing. The fix merged within the hour and could not
# publish until the next window closed — a correct town sat unpublished for
# twelve hours behind a test that had never watched a camera move. Before this
# file, the candle was the ONLY thing that ran those pins, which is backwards.
#
# SECURITY. `pull_request`, not `pull_request_target`: this runs the PR's own
# code, so it gets no secrets and read-only contents. It needs none. The world
# declares no runtime dependencies; its one devDependency is playwright, and
# this job is the one place it is installed (below).
#
# THE BROWSER IS CI'S, NOT THE BOX'S (POS-372; ruled 09-14). The viewer suites
# drive the World page in headless Chromium. Until this, they found playwright
# only through a hard-coded path into one operator's checkout, so CI and the box
# skipped every one of them and a viewer red could reach main unseen. Now
# playwright is a pinned devDependency with a lockfile: this job installs it and
# its Chromium, and fails if any viewer suite still skips for want of it. The box
# never runs an install in the world (the site installs the world as a dependency,
# which brings no devDependencies), so it stays browser-free, and there the
# viewer suites skip by name as they always have.
#
# MAIN AND ON DEMAND TOO (2026-10-07, Darko: no heavy local runs while the meeps
# run on the operator's machine). Until this, a pull request was the only place
# the suite ran off that machine, so a merged tip, or several PRs merged
# together on a candidate branch, was proven by a local full run, and each of
# those made the meeps' Letta server late enough to skip whole minutes of
# rounds. A push to main now grades the tip, and
# `gh workflow run suite -R postmark-town/postmark-world --ref <branch>` grades
# any candidate. A pull request's runs still cancel its own superseded runs; a
# tip's grade is never cancelled by the next push.

name: suite
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: suite-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  suite:
    if: github.repository == 'postmark-town/postmark-world'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, because the suite reads this repo's OWN history.
      # MEASURED on run 34867028169: tier-frames' falsifier locates its baseline
      # as the parent of the commit that introduced `tierRank`, then archives
      # that ref — on a shallow checkout the sha is simply not there and the
      # falsifier cannot find its own before-side. The blob filter defers the
      # bytes, as lane.yml does, so only the trees actually read get fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # MEASURED on this workflow's first run: 48 suites went red with
      # "Committer identity unknown". The settlement suites build scratch git
      # repos and let the REAL sweep code rebase them, and that code commits as
      # whoever the environment says it is — the keeper, on the box. The
      # fixtures set an identity per repo where they commit themselves; the
      # production path under test does not, and a bare runner has none. This is
      # the runner standing in for the box, not a test fixture.
      - name: a committer identity, which the sweep's own rebase needs
        run: |
          git config --global user.name "postmark suite"
          git config --global user.email "suite@postmark.invalid"

      # The one install: playwright from the lockfile, then its Chromium and the
      # libraries it needs. Everything else the suite imports is node builtins
      # and this repo's own modules.
      - name: playwright and its Chromium, for the viewer suites
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # A browser that will not launch would make every viewer suite skip and
      # read as a pass. Ask it once, here, so that failure has its own name.
      - name: the browser launches
        run: node -e 'import("playwright").then(async ({ chromium }) => { const b = await chromium.launch(); console.log(`chromium ${b.version()} launches`); await b.close(); })'

      # A viewer test asks for playwright inside a try/catch and skips itself,
      # loudly, when it is absent. That is right on the box and wrong here: in
      # this job a skip for want of playwright is the install having failed, so
      # it fails the run rather than reading as a pass.
      - name: the whole suite — behaviour AND the source pins, the viewer suites included
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/suite.tap"
          # A skip's reason follows a `#` in both reporters (tap: `# SKIP <reason>`, spec: `# <reason>`).
          if grep -E '# .*(playwright is absent|NO PLAYWRIGHT)' "$RUNNER_TEMP/suite.tap"; then
            echo "::error::a viewer suite skipped for want of playwright, so it guarded nothing. This job installs it; the install did not take." >&2
            exit 1
          fi
