# canon-review.yml — a PR that touches canon waits for Darko's look, recorded as an approval at its head (his, or
# Wright's recording it; WLD-159, 2026-11-05).
# tools/canon-review.mjs is the rule and says why; this only runs it. pull_request_target, so the BASE's copy of this
# file and of the script judge the PR: nothing from the PR is checked out or run, only its files and reviews are read
# through the API. A PR that touches no canon passes at once. After the approval, re-run this check
# (pull_request_target doesn't fire on a review).

name: canon-review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  darkos-look:
    if: github.repository == 'postmark-town/postmark-world'
    runs-on: ubuntu-latest
    steps:
      - name: main checkout (the rule runs from the base, never from the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: tools/canon-review.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: canon waits for Darko's look (an approval at the head, his or Wright's)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/canon-review.mjs
